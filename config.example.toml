default_profile = "default"

[adapters.codex]
command = "codex"

[adapters.claude]
command = "claude"

[adapters.opencode]
command = "opencode"

[adapters.cursor]
command = "cursor-agent"

[adapters.copilot]
command = "copilot"

[models.premium]
adapter = "codex"
model = ""

[models.standard]
adapter = "claude"
model = ""
fallback = ["premium"]

[profiles.default]
mode = "hybrid"
orchestrator = "premium"
executor = "standard"
advisor = "premium"
worker = "standard"
reviewer = "premium"
max_workers = 4
max_calls = 20
max_advisor_calls = 1
max_retries = 1
max_duration = "30m"

[profiles.codex]
mode = "single"
orchestrator = "premium"
executor = "premium"
advisor = "premium"
worker = "premium"
reviewer = "premium"
max_workers = 4
max_calls = 20
max_advisor_calls = 1
max_retries = 1
max_duration = "30m"

[profiles.claude]
mode = "single"
orchestrator = "standard"
executor = "standard"
advisor = "standard"
worker = "standard"
reviewer = "standard"
max_workers = 4
max_calls = 20
max_advisor_calls = 1
max_retries = 1
max_duration = "30m"

[profiles.advisor]
mode = "advisor"
orchestrator = "premium"
executor = "standard"
advisor = "premium"
worker = "standard"
reviewer = "premium"
max_workers = 4
max_calls = 20
max_advisor_calls = 1
max_retries = 1
max_duration = "30m"

[profiles.orchestrator]
mode = "orchestrator"
orchestrator = "premium"
executor = "standard"
advisor = "premium"
worker = "standard"
reviewer = "premium"
max_workers = 4
max_calls = 20
max_advisor_calls = 0
max_retries = 1
max_duration = "30m"
