default_profile = "default"

[adapters.codex]
command = "codex"

[adapters.claude]
command = "claude"

[adapters.opencode]
command = "opencode"

[adapters.cursor]
command = "cursor-agent"

[adapters.copilot]
command = "copilot"

[adapters.grok]
command = "grok"

[adapters.omp]
command = "omp"

[models.premium]
adapter = "codex"
model = ""

[models.standard]
adapter = "claude"
model = ""
fallback = ["premium"]

[models.grok]
adapter = "grok"
model = ""

[models.omp]
adapter = "omp"
model = ""

[profiles.default]
mode = "hybrid"
orchestrator = "premium"
executor = "standard"
advisor = "premium"
worker = "standard"
reviewer = "premium"
max_workers = 4
max_calls = 20
max_advisor_calls = 1
max_retries = 1
max_duration = "30m"

